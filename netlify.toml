[build]
  # No base — install runs at repo root so functions get their deps,
  # then we install + build the frontend explicitly.
  command = "npm install && npm --prefix frontend install && npm --prefix frontend run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Native binary — let Netlify include it rather than bundle it
  external_node_modules = ["sharp"]

# Image proxy → dedicated function (binary-safe; must precede /api/*)
[[redirects]]
  from   = "/api/proxy-image"
  to     = "/.netlify/functions/proxy-image"
  status = 200
  force  = true

# API → serverless Express function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# QR redirect → dedicated function
[[redirects]]
  from   = "/r/:code"
  to     = "/.netlify/functions/redirect"
  status = 200
  force  = true

# Client approval page → dedicated function (public, server-rendered)
[[redirects]]
  from   = "/approve/*"
  to     = "/.netlify/functions/approve"
  status = 200
  force  = true

# Client logo-request page → dedicated function (public, server-rendered)
[[redirects]]
  from   = "/logo-request/*"
  to     = "/.netlify/functions/logo-request"
  status = 200
  force  = true

# Customer onboarding page → dedicated function (public, server-rendered, tokenless)
[[redirects]]
  from   = "/setup/*"
  to     = "/.netlify/functions/setup"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
