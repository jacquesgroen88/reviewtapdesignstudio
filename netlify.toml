[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Tell Netlify where the functions live (relative to repo root)
[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

# Route API calls to the serverless function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# QR redirects — fast serverless redirect
[[redirects]]
  from   = "/r/:code"
  to     = "/.netlify/functions/redirect"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
